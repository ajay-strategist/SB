<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://wzqraqooarfoxkinuyic.supabase.co; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://wzqraqooarfoxkinuyic.supabase.co https://lh3.googleusercontent.com https://drive.google.com; connect-src 'self' https://wzqraqooarfoxkinuyic.supabase.co;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../SB Logo.png">
  <title>Mentor Dashboard — MentorFile</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/motion.css">
  <style>
    .mentee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-5);
    }
    .profile-section-title {
      font-size: var(--font-size-base);
      font-weight: 700;
      color: var(--brand-primary);
      margin: var(--space-6) 0 var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 2px solid var(--border-color);
    }
    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-6);
      background: var(--bg-surface-2);
      border-radius: var(--border-radius-lg);
    }
    /* Traits score styling */
    .trait-rating {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .trait-label {
      flex: 1;
      font-size: var(--font-size-sm);
      font-weight: 500;
    }
    .rating-dots {
      display: flex;
      gap: 4px;
    }
    .rating-dot-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border-color-strong);
      background: var(--bg-surface);
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .rating-dot-btn.active {
      background: var(--brand-primary);
      color: white;
      border-color: var(--brand-primary);
    }
    .sig-display-box {
      border: 1px dashed var(--border-color-strong);
      border-radius: var(--border-radius-md);
      padding: var(--space-4);
      background: var(--bg-surface-2);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .back-btn {
      margin-bottom: var(--space-5);
    }
    .qual-card {
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--space-4);
      background: var(--bg-surface);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .qual-card:hover { border-color: var(--border-color-strong); box-shadow: var(--shadow-xs); }
    .qual-rate .rating-dot-btn { width: 30px; height: 30px; font-weight: 600; }
    .qual-rate .rating-dot-btn.active { background: var(--brand-primary); color: #fff; border-color: var(--brand-primary); }
    /* Meeting Report */
    .mr-block { border-radius: var(--border-radius-lg); padding: var(--space-5); margin-bottom: var(--space-5); border-left: 4px solid var(--brand-primary); background: var(--bg-surface-2); }
    .mr-block h4 { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); font-weight: 700; margin: 0 0 var(--space-3); text-transform: uppercase; letter-spacing: 0.03em; }
    .mr-block h4 svg { width: 18px; height: 18px; }
    .mr-item { display: flex; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px dashed var(--border-color); align-items: baseline; }
    .mr-item:last-child { border-bottom: none; }
    .mr-date { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--text-tertiary); min-width: 92px; }
    .mr-text { font-size: var(--font-size-sm); color: var(--text-primary); line-height: 1.55; }
    .mr-goals { border-left-color: #059669; }
    .mr-goals h4 { color: #047857; }
    .mr-disc { border-left-color: #4F46E5; }
    .mr-disc h4 { color: #4338CA; }
    .mr-conf { border-left-color: #DC2626; background: rgba(220,38,38,0.04); }
    .mr-conf h4 { color: #B91C1C; }
    .mr-empty { color: var(--text-tertiary); font-size: var(--font-size-sm); padding: var(--space-2) 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Mobile overlay -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div id="sidebar-content"></div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <nav class="breadcrumb" id="breadcrumb">
            <span>Mentor</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="current" id="breadcrumb-current">Dashboard</span>
          </nav>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="Theme.toggle()" title="Toggle theme" aria-label="Toggle dark mode">
            <span id="theme-icon-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
          </button>
          <button class="header-btn" onclick="showNotifications()" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="badge" id="notif-badge" style="display:none">0</span>
          </button>
        </div>
      </header>

      <!-- Page Content Container -->
      <div class="page-content" id="page-content">
        <div class="page-loader">
          <div style="width:100%;max-width:1200px;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);">
            <div style="height:32px;width:240px;" class="skeleton-shimmer"></div>
            <div style="height:20px;width:360px;margin-bottom:var(--space-4);" class="skeleton-shimmer"></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:var(--space-4);">
              <div style="height:100px;border-radius:var(--border-radius-lg);" class="skeleton-shimmer"></div>
              <div style="height:100px;border-radius:var(--border-radius-lg);" class="skeleton-shimmer"></div>
              <div style="height:100px;border-radius:var(--border-radius-lg);" class="skeleton-shimmer"></div>
              <div style="height:100px;border-radius:var(--border-radius-lg);" class="skeleton-shimmer"></div>
            </div>
            <div style="height:300px;width:100%;border-radius:var(--border-radius-lg);" class="skeleton-shimmer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js" integrity="sha512-omCJ8S/xl+DUjxNTqvhVSptHwIEi0IDp52n63HEj8ThJgSK/8Lcpi9btnTdE8db+Y4cDKZrZ7NQZBX4PKN4i4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="../js/motion.js"></script>
  <script>
    let session;
    let selectedStudentId = null;
    let selectedClassId = null;
    let activeClassTab = 'students';
    let activeSubTab = 'profile';
    let currentRecordSemester = 1;

    window.addEventListener('DOMContentLoaded', async () => {
      await DB.init();
      session = requireAuth(['mentor', 'hod', 'principal']);
      if (!session) return;

      buildMentorSidebar();
      updateThemeIcon();
      updateNotifBadge();
      renderDashboard();
    });

    function buildMentorSidebar() {
      const college = DB.Settings.getCollegeInfo();
      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-logo">
          <img src="../SB Logo.png" alt="St. Berchmans College" style="height:42px;object-fit:contain">
          <div class="sidebar-logo-text"><p>Teacher Portal</p></div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-section-label">Overview</div>
            <button class="nav-item active" id="nav-dashboard" onclick="showMentorTab('dashboard')">${Icons.home}<span class="nav-item-text">Dashboard</span></button>
            <button class="nav-item" id="nav-class" onclick="showMentorTab('class')">${Icons.grid}<span class="nav-item-text">Class</span></button>
            <button class="nav-item" id="nav-settings" onclick="showUserMenu()">${Icons.settings}<span class="nav-item-text">Profile & Settings</span></button>
          </div>
          ${['hod', 'principal'].includes(session.role) ? `
            <div class="nav-section">
              <div class="nav-section-label">Management</div>
              <button class="nav-item" onclick="window.location.href='hod.html'">${Icons.chevronLeft}<span class="nav-item-text">HOD Portal</span></button>
            </div>
          ` : ''}
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user" onclick="showUserMenu()">
            ${renderAvatar(session.name, 'sm')}
            <div class="sidebar-user-info">
              <div class="name">${session.name}</div>
              <div class="role">${roleLabel(session.role)}</div>
            </div>
          </div>
          <button class="btn btn-danger btn-full btn-sm" style="margin-top:var(--space-3)" onclick="logout()">${Icons.logOut}<span style="margin-left:6px">Sign Out</span></button>
        </div>`;
    }

    // ── Top-level tab navigation (Dashboard | Class [Class/Students view]) ──
    let mentorTab = 'dashboard';
    let classViewMode = 'class'; // 'class' | 'students'
    function showMentorTab(tab) {
      const navEl = document.getElementById(`nav-${tab}`);
      if (navEl) Motion.glidePill(document.querySelector('.sidebar-nav'), navEl);
      
      Motion.transition(document.getElementById('page-content'), () => {
        mentorTab = tab; selectedStudentId = null;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        navEl?.classList.add('active');
        if (tab === 'dashboard') renderDashboard();
        else if (tab === 'class') renderClassTab();
      });
    }

    // My students (assigned mentees)
    function myStudents() {
      return DB.Assignments.getMentees(session.userId).map(id => DB.Users.getById(id)).filter(Boolean);
    }

    function renderClassTab() {
      document.getElementById('breadcrumb-current').textContent = 'Class';
      const container = document.getElementById('page-content');
      const students = myStudents();
      // Group my students by class (program) — only classes where I have students
      const byProgram = {};
      students.forEach(s => { (byProgram[s.programId] = byProgram[s.programId] || []).push(s); });

      const inchargeClasses = DB.Classes.getAll().filter(c => c.inchargeId === session.userId);

      const inchargeSection = inchargeClasses.length > 0 ? `
        <h2 style="font-size:var(--font-size-base);font-weight:700;margin-bottom:var(--space-3)">Classes I am In-charge of</h2>
        <div class="mentee-grid" style="margin-bottom:var(--space-6)">
          ${inchargeClasses.map(c => {
            const cs = DB.Classes.getStudents(c.id);
            const dept = DB.Departments.getById(c.departmentId);
            return `<div class="section-card"><div class="section-card-body">
              <div class="font-semibold">${c.name}</div>
              <div class="text-xs text-muted">${dept?.name || ''} · ${c.durationYears} yrs</div>
              <hr class="divider">
              <div class="text-sm"><strong>Total Students:</strong> ${cs.length}</div>
              <button class="btn btn-primary btn-sm mt-3" onclick="openInchargeClass('${c.id}')">View & Manage Class</button>
            </div></div>`;
          }).join('')}
        </div>
      ` : '';

      const mentorshipSection = `
        <h2 style="font-size:var(--font-size-base);font-weight:700;margin-bottom:var(--space-3)">My Mentees</h2>
        <div class="mentee-grid">
          ${Object.keys(byProgram).map(pid => {
            const program = DB.Programs.getById(pid);
            const cs = byProgram[pid];
            return `<div class="section-card"><div class="section-card-body">
              <div class="font-semibold">${program?.name || 'Class'}</div>
              <div class="text-xs text-muted">${program?.semesterCount || 6} semesters</div>
              <hr class="divider"><div class="text-sm"><strong>My students here:</strong> ${cs.length}</div>
              <button class="btn btn-secondary btn-sm mt-3" onclick="showClassStudents('${pid}')">View Students</button>
            </div></div>`;
          }).join('') || '<div class="empty-state"><p>No classes — you have no assigned students yet.</p></div>'}
        </div>`;

      container.innerHTML = `
        <div class="page-header"><h1 class="page-title">My Class</h1><p class="page-subtitle">Manage classes you are in charge of and view your assigned mentees.</p></div>
        <div class="tabs" style="margin-bottom:var(--space-5)">
          <button class="tab-btn ${classViewMode==='class'?'active':''}" onclick="setClassView('class')">Class View</button>
          <button class="tab-btn ${classViewMode==='students'?'active':''}" onclick="setClassView('students')">Students View</button>
        </div>
        <div id="class-view-body">
          ${classViewMode === 'class' ? `${inchargeSection}${mentorshipSection}` : studentsTableHTML(students)}
        </div>`;
    }

    function setClassView(mode) { classViewMode = mode; renderClassTab(); }

    function showClassStudents(pid) {
      classViewMode = 'students';
      renderClassTab();
      const students = myStudents().filter(s => s.programId === pid);
      document.getElementById('class-view-body').innerHTML = studentsTableHTML(students);
    }

    function openInchargeClass(classId) {
      classViewMode = 'students';
      selectedClassId = classId;
      renderClassTab();
      
      const cls = DB.Classes.getById(classId);
      const students = DB.Classes.getStudents(classId);
      const program = DB.Programs.getById(cls?.programId);
      const sems = program?.semesterCount || 6;
      const classCourses = cls?.semesterCourses || {};
      const programCourses = program?.defaultCourses || {};
      
      if (!tempCourses || tempCourses._classId !== classId) {
        tempCourses = { _classId: classId };
        for (let s = 1; s <= sems; s++) {
          tempCourses[s] = classCourses[s] || programCourses[s] || [];
        }
        window._mcActiveSem = "1";
      }

      const isStudents = activeClassTab === 'students';
      let tabContent = '';

      if (isStudents) {
        tabContent = `
          <!-- Search bar & actions -->
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-3)">
            <div class="search-input-wrapper" style="width:300px;position:relative">
              <span class="search-icon" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);height:16px;width:16px;color:var(--text-tertiary);display:flex;align-items:center">${Icons.search}</span>
              <input type="text" class="form-input" id="class-student-search" placeholder="Search students..." oninput="filterClassStudents()" style="padding-left:36px;width:100%">
            </div>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="exportClassToCSV('${classId}')">${Icons.download} Export Excel</button>
              <button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="showSyncPhotosModal('${classId}')">${Icons.image} Sync Photos</button>
              <button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="showImportClassStudentsModal('${classId}')">${Icons.upload} Import CSV</button>
              <button class="btn btn-primary btn-sm hover-lift press-scale" onclick="showAddStudentsModal('${classId}')">${Icons.plus} Add Students</button>
            </div>
          </div>

          <!-- Bulk Actions Toolbar -->
          <div id="bulk-actions-toolbar" class="bulk-toolbar" style="display:none;margin-bottom:var(--space-4);background:var(--bg-surface-2);padding:var(--space-3) var(--space-4);border-radius:var(--border-radius-md);border-left:4px solid var(--brand-primary);align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3)">
            <div class="text-sm font-semibold"><span id="selected-count">0</span> students selected</div>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" onclick="bulkMoveClass()">${Icons.grid} Move Class</button>
              <button class="btn btn-secondary btn-sm" onclick="bulkAssignMentor()">${Icons.user} Assign Mentor</button>
              <button class="btn btn-secondary btn-sm text-warning" onclick="bulkRemoveFromClass()">${Icons.x} Remove from Class</button>
              <button class="btn btn-danger btn-sm" onclick="bulkDeleteStudents()">${Icons.trash} Delete</button>
            </div>
          </div>

          <div class="section-card"><div class="table-wrapper"><table class="data-table">
            <thead>
              <tr>
                <th style="width:40px"><input type="checkbox" id="select-all-class" onclick="toggleSelectAllClass(this.checked)"></th>
                <th>Student</th>
                <th>Class</th>
                <th>Attendance (Current Sem)</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="class-students-tbody">
              ${students.map(s => rowForClassStudent(s)).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary);padding:var(--space-6)">No students in this class.</td></tr>`}
            </tbody>
          </table></div></div>`;
      } else {
        tabContent = `
          <div class="section-card">
            <div class="section-card-header"><div class="section-card-title">${Icons.book} Class Course List</div></div>
            <div class="section-card-body">
              <div class="form-grid" style="grid-template-columns: 200px 1fr; gap: var(--space-5);">
                <div>
                  <label class="form-label font-semibold">Select Semester</label>
                  <div class="flex flex-col gap-1" id="class-courses-sem-tabs" style="display:flex;flex-direction:column;gap:6px">
                    ${Array.from({ length: sems }, (_, idx) => {
                      const semNum = idx + 1;
                      const isSemActive = window._mcActiveSem === String(semNum);
                      return `<button class="btn btn-block btn-sm ${isSemActive ? 'btn-primary' : 'btn-secondary'}" onclick="switchCourseSem('${classId}', ${semNum})" style="justify-content: flex-start; text-align: left; width: 100%;">${isSemActive ? '● ' : ''}Semester ${semNum}</button>`;
                    }).join('')}
                  </div>
                </div>
                <div>
                  <label class="form-label font-semibold" style="display:block;margin-bottom:var(--space-2)">Courses for Semester <span id="active-sem-num">${window._mcActiveSem}</span> (one per line)</label>
                  <textarea class="form-textarea" id="class-courses-textarea" rows="8" placeholder="e.g.&#10;Mathematics I&#10;Programming in C" style="width: 100%; font-family: inherit; font-size: inherit; padding: var(--space-3); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); background: var(--bg-surface-1); color: var(--text-primary);" oninput="updateTempCourses('${classId}')">${(tempCourses[window._mcActiveSem] || []).join('\n')}</textarea>
                  <div class="form-hint" style="margin-top: var(--space-2)">Enter each course name on a new line. Click Save below to apply.</div>
                  <button class="btn btn-primary mt-4 hover-lift press-scale" onclick="saveClassCoursesDirect('${classId}')">${Icons.check} Save Courses</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('class-view-body').innerHTML = `
        <div style="margin-bottom:var(--space-4)">
          <button class="btn btn-secondary btn-sm" onclick="setClassView('class')">${Icons.chevronLeft} Back to Classes</button>
        </div>
        <div class="page-header" style="margin-top:0">
          <h2 class="page-title">${cls?.name || 'Class'}</h2>
          <p class="page-subtitle">${students.length} students enrolled · Year ${cls?.currentYear} / ${cls?.durationYears}</p>
        </div>

        <div class="tabs" style="margin-bottom:var(--space-4)">
          <button class="tab-btn ${activeClassTab === 'students' ? 'active' : ''}" onclick="switchClassTab('${classId}', 'students')">Students Name</button>
          <button class="tab-btn ${activeClassTab === 'courses' ? 'active' : ''}" onclick="switchClassTab('${classId}', 'courses')">Courses</button>
        </div>

        ${tabContent}`;
    }

    function rowForClassStudent(s) {
      const program = DB.Programs.getById(s.programId);
      const isMyMentee = DB.Assignments.getMentees(session.userId).includes(s.id);
      return `<tr>
        <td><input type="checkbox" class="student-select-cb" data-id="${s.id}" onchange="updateBulkToolbar()"></td>
        <td><div class="flex items-center gap-3">${renderAvatar(s.name,'sm',null,s.id)}<span class="font-semibold text-sm">${Str.escHtml(s.name)}</span></div></td>
        <td class="text-sm">${Str.escHtml(program?.name || '—')}</td>
        <td>${currentSemAttendance(s.id)}</td>
        <td>${renderStatusBadge(DB.Analytics.getStudentStatus(s.id))}</td>
        <td><div class="flex gap-2">
          ${isMyMentee ? `<button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="viewMenteeFile('${s.id}')">${Icons.fileText} Report</button>` : ''}
          <button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="editStudentIdentity('${s.id}')" title="Edit name & email">${Icons.edit}</button>
          <button class="btn btn-secondary btn-sm hover-lift press-scale" onclick="scheduleMeetingFor('${s.id}')" title="Schedule Meeting">${Icons.calendar}</button>
        </div></td>
      </tr>`;
    }

    function toggleSelectAllClass(checked) {
      document.querySelectorAll('.student-select-cb').forEach(cb => {
        cb.checked = checked;
      });
      updateBulkToolbar();
    }

    function updateBulkToolbar() {
      const checked = [...document.querySelectorAll('.student-select-cb')].filter(cb => cb.checked);
      const toolbar = document.getElementById('bulk-actions-toolbar');
      const countLabel = document.getElementById('selected-count');
      if (toolbar && countLabel) {
        if (checked.length > 0) {
          toolbar.style.display = 'flex';
          countLabel.textContent = checked.length;
        } else {
          toolbar.style.display = 'none';
          const selectAll = document.getElementById('select-all-class');
          if (selectAll) selectAll.checked = false;
        }
      }
    }

    function getSelectedStudentIds() {
      return [...document.querySelectorAll('.student-select-cb')].filter(cb => cb.checked).map(cb => cb.dataset.id);
    }

    function bulkMoveClass() {
      const ids = getSelectedStudentIds();
      if (!ids.length) return;
      const isPrincipal = session.role === 'principal';
      const classes = DB.Classes.getAll().filter(c => isPrincipal || c.departmentId === session.departmentId);
      Modal.create('bulk-move', {
        title: `Move ${ids.length} Students`, size: 'sm',
        body: `
          <div class="form-group">
            <label class="form-label required">Select New Class</label>
            <select class="form-select" id="bm-class">
              <option value="">— Select Class —</option>
              ${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
          </div>`,
        footer: `<button class="btn btn-secondary" onclick="Modal.close('bulk-move')">Cancel</button>
                 <button class="btn btn-primary" onclick="doBulkMoveClass()">Move</button>`,
      });
    }

    function doBulkMoveClass() {
      const classId = document.getElementById('bm-class').value;
      if (!classId) { Toast.error('Select a class'); return; }
      const ids = getSelectedStudentIds();
      const cls = DB.Classes.getById(classId);
      ids.forEach(id => {
        DB.Users.update(id, { classId, programId: cls?.programId, departmentId: cls?.departmentId }, session.userId);
      });
      Toast.success('Moved', `${ids.length} students moved to ${cls.name}.`);
      Modal.close('bulk-move');
      openInchargeClass(selectedClassId);
    }

    function bulkAssignMentor() {
      const ids = getSelectedStudentIds();
      if (!ids.length) return;
      const isPrincipal = session.role === 'principal';
      const faculty = DB.Users.getAll().filter(u => (u.role === 'mentor' || u.role === 'hod') && (isPrincipal || u.departmentId === session.departmentId));
      Modal.create('bulk-assign', {
        title: `Assign Mentor to ${ids.length} Students`, size: 'sm',
        body: `
          <div class="form-group">
            <label class="form-label required">Select Mentor</label>
            <select class="form-select" id="ba-mentor">
              <option value="">— Select Mentor —</option>
              ${faculty.map(f => `<option value="${f.id}">${f.name} (${roleLabel(f.role)})</option>`).join('')}
            </select>
          </div>`,
        footer: `<button class="btn btn-secondary" onclick="Modal.close('bulk-assign')">Cancel</button>
                 <button class="btn btn-primary" onclick="doBulkAssignMentor()">Assign</button>`,
      });
    }

    function doBulkAssignMentor() {
      const mentorId = document.getElementById('ba-mentor').value;
      if (!mentorId) { Toast.error('Select a mentor'); return; }
      const ids = getSelectedStudentIds();
      const mentor = DB.Users.getById(mentorId);
      ids.forEach(id => {
        DB.Assignments.assign(mentorId, id, session.userId);
      });
      Toast.success('Assigned', `${ids.length} students assigned to ${mentor.name}.`);
      Modal.close('bulk-assign');
      openInchargeClass(selectedClassId);
    }

    function bulkRemoveFromClass() {
      const ids = getSelectedStudentIds();
      if (!ids.length) return;
      Modal.confirm({
        title: `Remove ${ids.length} Students`,
        message: `Are you sure you want to remove these ${ids.length} students from this class? Their course details will be unlinked.`,
        confirmText: 'Remove',
        confirmClass: 'btn-danger',
        onConfirm: () => {
          ids.forEach(id => {
            DB.Users.update(id, { classId: null }, session.userId);
          });
          Toast.success('Removed', `${ids.length} students removed from class.`);
          openInchargeClass(selectedClassId);
        }
      });
    }

    function bulkDeleteStudents() {
      const ids = getSelectedStudentIds();
      if (!ids.length) return;
      Modal.confirm({
        title: `Delete ${ids.length} Students`,
        message: `This will permanently delete these ${ids.length} student accounts and all their records from the system. This cannot be undone.`,
        confirmText: 'Delete Permanently',
        confirmClass: 'btn-danger',
        onConfirm: () => {
          ids.forEach(id => {
            DB.Users.delete(id, session.userId);
          });
          Toast.success('Deleted', `${ids.length} student accounts deleted.`);
          openInchargeClass(selectedClassId);
        }
      });
    }

      const cls = DB.Classes.getById(classId);

        title: `Add Students to ${cls?.name || 'Class'}`, size: 'md',

    function toggleSelectAllAdd(checked) {
      document.querySelectorAll('.as-student-cb').forEach(cb => {
        cb.checked = checked;
      });

    function filterAddStudents() {
      const query = document.getElementById('as-search').value.toLowerCase();
      document.querySelectorAll('.as-row').forEach(row => {
        const name = row.dataset.name;
        const email = row.dataset.email;
        if (name.includes(query) || email.includes(query)) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    function doAddStudents(classId) {
      const checkedCbs = [...document.querySelectorAll('.as-student-cb')].filter(cb => cb.checked);
      if (!checkedCbs.length) { Toast.error('Select at least one student'); return; }
      
      const cls = DB.Classes.getById(classId);
      checkedCbs.forEach(cb => {
        const studentId = cb.dataset.id;
        DB.Users.update(studentId, { classId, programId: cls?.programId, departmentId: cls?.departmentId }, session.userId);
      });

      Toast.success('Success', `${checkedCbs.length} students added to class.`);
      Modal.close('add-students');
      openInchargeClass(classId);
    }

    function currentSemAttendance(studentId) {
      const recs = DB.SemesterRecords.getAll(studentId);
      const latest = recs[recs.length - 1];
      return latest && latest.attendance != null ? latest.attendance + '%' : '—';
    }

    // Teacher sets a student's Name & Email; the student fills the rest of their profile themselves.
    function editStudentIdentity(studentId) {
      const s = DB.Users.getById(studentId);
      const p = DB.Profiles.get(studentId) || {};
      Modal.create('edit-id', {
        title: 'Edit Student Details', size: 'sm',
        body: `
          <div class="alert alert-info mb-4">${Icons.info} You can update the student's name, email, and photo link. The student completes the rest of their profile after logging in.</div>
          <div class="form-group"><label class="form-label required">Full Name</label><input class="form-input" id="ei-name" value="${Str.escHtml(s.name)}"></div>
          <div class="form-group"><label class="form-label required">Email (login ID)</label><input type="email" class="form-input" id="ei-email" value="${Str.escHtml(s.email)}"></div>
          <div class="form-group"><label class="form-label">Photo URL (Google Drive / Image Link)</label><input class="form-input" id="ei-photo" value="${p.avatarUrl || ''}" placeholder="Paste Google Drive link or web URL"></div>`,
        footer: `<button class="btn btn-secondary" onclick="Modal.close('edit-id')">Cancel</button>
                 <button class="btn btn-primary" onclick="saveStudentIdentity('${studentId}')">Save</button>`,
      });
    }
    function saveStudentIdentity(studentId) {
      const name = document.getElementById('ei-name').value.trim();
      const email = document.getElementById('ei-email').value.trim().toLowerCase();
      const photoUrl = document.getElementById('ei-photo').value.trim();
      if (!name || !email) { Toast.error('Name and email required'); return; }
      
      const convertedPhotoUrl = Str.convertDriveLink(photoUrl);
      DB.Users.update(studentId, { name, email }, session.userId);
      DB.Profiles.save(studentId, { ...(DB.Profiles.get(studentId)||{}), avatarUrl: convertedPhotoUrl }, session.userId);
      
      Toast.success('Saved', 'Student updated.');
      Modal.close('edit-id');
      
      if (selectedClassId) {
        openInchargeClass(selectedClassId);
      } else {
        renderClassTab();
      }
    }

    // Refer a student to the HOD
    function referToHOD(studentId) {
      const s = DB.Users.getById(studentId);
      const hod = DB.Users.getAll().find(u => u.role === 'hod' && u.departmentId === session.departmentId);
      if (!hod) { Toast.warning('No HOD found', 'No HOD is set for your department.'); return; }
      Modal.create('refer', {
        title: `Refer ${Str.escHtml(s.name)} to HOD`, size: 'sm',
        body: `<div class="form-group"><label class="form-label">Reason / note for HOD</label><textarea class="form-textarea" id="refer-note" rows="3" placeholder="e.g. Please speak with this student regarding attendance."></textarea></div>`,
        footer: `<button class="btn btn-secondary hover-lift press-scale" onclick="Modal.close('refer')">Cancel</button><button class="btn btn-primary hover-lift press-scale" onclick="doRefer('${studentId}','${hod.id}')">Send Referral</button>`,
      });
    }
    function doRefer(studentId, hodId) {
      const s = DB.Users.getById(studentId);
      const note = document.getElementById('refer-note').value.trim();
      DB.Notifications.create(hodId, 'Student Referred by Teacher', `${session.name} referred ${s.name}. ${note}`, 'warning');
      Toast.success('Referred', 'The HOD has been notified.');
      Modal.close('refer');
    }

    // Visible parent-approval control (Teacher)
    function setParentApproval(studentId, approve) {
      if (approve) DB.ParentLinks.approve(studentId, session.userId);
      else DB.ParentLinks.revoke(studentId, session.userId);
      Toast.success(approve ? 'Parent Approved' : 'Access Revoked', approve ? 'Parent can now view the report.' : 'Parent access revoked.');
      renderClassTab();
    }

        document.getElementById('mobile-overlay').classList.toggle('show');
      } else {

      }

    function closeMobileSidebar() {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('mobile-overlay').classList.remove('show');
    }

    // ── Dashboard ────────────────────────────────────────────────

      document.getElementById('breadcrumb-current').textContent = 'Dashboard';
      const container = document.getElementById('page-content');
      
      const studentIds = DB.Assignments.getMentees(session.userId);

      const statusStats = { green: 0, yellow: 0, red: 0, gray: 0 };
      students.forEach(s => {
        statusStats[DB.Analytics.getStudentStatus(s.id)]++;
      });

      container.innerHTML = `
        <div class="page-header">
          <h1 class="page-title">Mentor Dashboard</h1>
          <p class="page-subtitle">Welcome back, ${session.name}. Here are your assigned mentees.</p>

        <div class="stats-grid">
          ${statCard('Total Mentees', students.length, Icons.users, 'linear-gradient(135deg, #4F46E5, #6366F1)')}
          ${statCard('On Track', statusStats.green, Icons.check_circle, 'linear-gradient(135deg, #059669, #10B981)')}
          ${statCard('Needs Attention', statusStats.yellow, Icons.info, 'linear-gradient(135deg, #F59E0B, #FBBF24)')}
          ${statCard('At Risk', statusStats.red, Icons.alert, 'linear-gradient(135deg, #DC2626, #EF4444)')}

        ${(() => {
          const flagged = students.filter(s => DB.Analytics.getStudentStatus(s.id) !== 'green');
          if (!flagged.length) return '';
          return `<div class="section-card mb-6">

            <div class="section-card-body" style="padding:0">
              ${flagged.map(s => {
                const status = DB.Analytics.getStudentStatus(s.id);
                const program = DB.Programs.getById(s.programId);

                  ${renderAvatar(s.name,'sm',null,s.id)}

              }).join('')}
            </div>
          </div>`;
        })()}

        <div class="section-card">
          <div class="section-card-header">

          <div class="section-card-body">

                        <button class="btn btn-secondary btn-sm" onclick="showProgramConfig('${pid}')" title="Program Settings">${Icons.settings}</button>

                      <hr class="divider">

    function statCard(label, value, icon, gradient) {
      const valStr = String(value);
      const isNumber = /^[0-9]+(\.[0-9]+)?%?$/.test(valStr.trim());
      let valueHtml = valStr;
      if (isNumber) {
        const numPart = parseFloat(valStr);
        const suffix = valStr.includes('%') ? '%' : '';
        valueHtml = `<span class="count-up-value" data-target="${numPart}">${numPart}</span>${suffix}`;
      } else if (!valStr.includes('<span') && !valStr.includes('<div')) {
        valueHtml = Str.escHtml(valStr);
      }
      return `<div class="stat-card hover-lift">
        <div class="stat-card-icon" style="background:${gradient};color:white">${icon}</div>
        <div class="stat-card-value">${valueHtml}</div>
        <div class="stat-card-label">${label}</div>
      </div>`;
    }

    // ── Mentee File Viewer ────────────────────────────────────────
    let menteeOrigin = 'dashboard';
    function viewMenteeFile(studentId) {
      const myMenteeIds = DB.Assignments.getMentees(session.userId);
      if (!myMenteeIds.includes(studentId)) {
        Toast.error('Access Denied', 'You can only view files/reports of your assigned mentees.');
        return;
      }
      Motion.transition(document.getElementById('page-content'), () => {
        selectedStudentId = studentId;
        activeSubTab = 'profile';
        menteeOrigin = (mentorTab === 'class') ? 'class' : 'dashboard';
        const student = DB.Users.getById(studentId);
        document.getElementById('breadcrumb-current').textContent = student.name;
        renderMenteeFile();
      });
    }

    function exitMenteeFile() {
      Motion.transition(document.getElementById('page-content'), () => {
        if (menteeOrigin === 'class') showMentorTab('class');
        else renderDashboard();
      });
    }

    function renderMenteeFile() {
      const container = document.getElementById('page-content');

      const program = DB.Programs.getById(student.programId);

      container.innerHTML = `
        <button class="btn btn-secondary btn-sm back-btn" onclick="exitMenteeFile()">${Icons.chevronLeft} ${menteeOrigin === 'class' ? 'Back to Class' : 'Back to Dashboard'}</button>
        
        <div class="page-header" style="margin-bottom:var(--space-6)">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3)">
            <div style="display:flex;align-items:center;gap:var(--space-4)">
              ${renderAvatar(student.name, 'lg', null, student.id)}
              <div>
                <h1 class="page-title" style="view-transition-name:name-${student.id};width:fit-content">${student.name}</h1>
                <p class="page-subtitle">${program?.name || '—'} · ${program?.semesterCount || 6} Semesters</p>
              </div>
            </div>
            <div class="flex gap-2">
               <button class="btn btn-secondary" onclick="PDFGen.showExportModal('${selectedStudentId}')">${Icons.download} Export PDF</button>
            </div>
          </div>
        </div>

        <div class="tabs" style="margin-bottom:var(--space-6)">
          <button class="tab-btn ${activeSubTab==='profile'?'active':''}" onclick="switchSubTab('profile')">Personal Info</button>
          <button class="tab-btn ${activeSubTab==='academic'?'active':''}" onclick="switchSubTab('academic')">Academic & Attendance</button>
          <button class="tab-btn ${activeSubTab==='extracredit'?'active':''}" onclick="switchSubTab('extracredit')">Extra-Credit & Awards</button>
          <button class="tab-btn ${activeSubTab==='meetings'?'active':''}" onclick="switchSubTab('meetings')">Meetings</button>
          <button class="tab-btn ${activeSubTab==='qualitative'?'active':''}" onclick="switchSubTab('qualitative')">Qualitative Record</button>
          <button class="tab-btn ${activeSubTab==='meetingreport'?'active':''}" onclick="switchSubTab('meetingreport')">Meeting Report</button>
          <button class="tab-btn ${activeSubTab==='datewisereport'?'active':''}" onclick="switchSubTab('datewisereport')">Date wise Report</button>
        </div>

        <div id="sub-tab-content"></div>`;

      renderSubTabContent();
      setTimeout(() => {
        const activeBtn = document.querySelector('.tabs .tab-btn.active');
        if (activeBtn) {
          Motion.glideUnderline(document.querySelector('.tabs'), activeBtn);
        }
      }, 50);
    }

    function switchSubTab(tab) {
      activeSubTab = tab;
      const tabButtons = document.querySelectorAll('.tabs .tab-btn');
      let activeBtn = null;
      tabButtons.forEach(btn => {
        const isCurrent = btn.getAttribute('onclick').includes(`'${tab}'`);
        if (isCurrent) {
          btn.classList.add('active');
          activeBtn = btn;
        } else {
          btn.classList.remove('active');
        }
      });
      if (activeBtn) {
        Motion.glideUnderline(document.querySelector('.tabs'), activeBtn);
      }
      Motion.transition(document.getElementById('sub-tab-content'), renderSubTabContent);

  // ── Custom qualitative parameters (configurable, all optional) ──
  let qualParamRatings = {};
  function setParamRating(label, v, btn) {
    qualParamRatings[label] = v;
    const card = btn.closest('.qual-card');
    card.querySelectorAll('.rating-dot-btn').forEach((b, idx) => b.classList.toggle('active', idx < v));
    const clearBtn = card.querySelector('button[onclick^="clearParamRating"]');
    if (clearBtn) clearBtn.style.visibility = 'visible';
  }
  function clearParamRating(label, btn) {
    delete qualParamRatings[label];
    const card = btn.closest('.qual-card');
    card.querySelectorAll('.rating-dot-btn').forEach(b => b.classList.remove('active'));
    btn.style.visibility = 'hidden';
  }
  function manageQualParams() {
    const params = DB.Settings.getQualitativeParameters();
    Modal.create('qparams', {
      title: 'Manage Qualitative Parameters', size: 'sm',
      body: `<p class="text-xs text-muted mb-3">One parameter per line. HOD/Teacher can change these; all are optional to fill.</p>
             <textarea class="form-textarea" id="qp-list" rows="10">${params.join('\n')}</textarea>`,
      footer: `<button class="btn btn-secondary" onclick="Modal.close('qparams')">Cancel</button>
               <button class="btn btn-primary" onclick="saveQualParams()">Save Parameters</button>`,
    });
  }
  function saveQualParams() {
    const list = document.getElementById('qp-list').value.split('\n').map(s=>s.trim()).filter(Boolean);
    DB.Settings.set({ qualitativeParameters: list });
    Toast.success('Saved', 'Parameters updated.');
    Modal.close('qparams');
    renderSubTabContent();
  }

  // Mentor completes / reopens a goal (final review). Closes only after mentor approves.
  function setGoalDone(id, done) {
    DB.Meetings.update(id, { goalDone: done }, session.userId);
    if (done) {
      const m = DB.Meetings.getAll(selectedStudentId).find(x => x.id === id);
      DB.Notifications.create(selectedStudentId, 'Goal Completed', `Your mentor marked a goal as completed: "${(m?.goals||'').slice(0,60)}"`, 'success');
      if (window.Motion) Motion.celebrate();
    }
    Toast.success(done ? 'Goal Completed' : 'Goal Reopened');
    renderSubTabContent();
  }

  function toggleHostelFields(val) {
    document.getElementById('hostel-fields-wrap').style.display = val === 'hosteler' ? 'block' : 'none';
  }

  // ── Profile Save ──────────────────────────────────────────────
  function saveProfile(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    DB.Profiles.save(selectedStudentId, data, session.userId);
    Toast.success('Profile Saved', 'Personal information has been updated successfully.');
  }

              ${(() => {
                const student = DB.Users.getById(selectedStudentId);
                const coursesToRender = (record.courses && record.courses.length > 0)
                  ? record.courses
                  : DB.Classes.getCoursesForSemester(student?.classId, student?.programId, currentRecordSemester).map(name => ({ name }));
                return coursesToRender.map(su => courseRowHTML(su)).join('');
              })()}

          </table></div>

        </div>

  // Component columns come from the program config: N internals + other components
  function componentColumns() {
    const student = DB.Users.getById(selectedStudentId);
    const cfg = DB.ProgramConfig.get(student?.programId);
    const internals = Array.from({ length: cfg.numInternals || 1 }, (_, i) => `Internal ${i + 1}`);
    const others = (cfg.components || []).filter(c => !/^internal/i.test(c));
    return [...internals, ...others];
  }

  function courseRowHTML(su = {}) {
    const cols = componentColumns();
    const marks = { ...(su.marks || {}) };
    if (su.internal != null && su.internal !== '' && marks['Internal 1'] == null) marks['Internal 1'] = su.internal;
    return `<tr>
      <td><input class="form-input" data-f="name" value="${su.name ? Str.escHtml(su.name) : ''}" placeholder="Course"></td>
      <td><input class="form-input" type="number" data-f="attendance" value="${su.attendance ?? ''}" style="max-width:90px"></td>
      ${cols.map(c => `<td><input class="form-input" type="number" data-comp="${Str.escHtml(c)}" value="${marks[c] ?? ''}" style="max-width:90px"></td>`).join('')}
      <td><input class="form-input" type="number" data-f="external" value="${su.external ?? ''}" style="max-width:90px"></td>
      <td><input class="form-input" data-f="grade" value="${su.grade ? Str.escHtml(su.grade) : ''}" style="max-width:80px"></td>
      <td><button class="btn btn-ghost btn-sm btn-icon" onclick="this.closest('tr').remove()">${Icons.trash}</button></td>
    </tr>`;
  }
  function addCourseRow() {
    document.getElementById('courses-tbody').insertAdjacentHTML('beforeend', courseRowHTML());
  }
  function saveCourses() {
    const rows = [...document.querySelectorAll('#courses-tbody tr')];
    const courses = rows.map(tr => {
      const g = f => tr.querySelector(`[data-f="${f}"]`).value.trim();
      const marks = {};
      tr.querySelectorAll('[data-comp]').forEach(inp => { if (inp.value.trim() !== '') marks[inp.dataset.comp] = inp.value.trim(); });
      const internal = marks['Internal 1'] ?? ''; // keep flat value for read-only views
      return { name: g('name'), attendance: g('attendance'), marks, internal, external: g('external'), grade: g('grade') };
    }).filter(s => s.name);
    const rec = DB.SemesterRecords.get(selectedStudentId, currentRecordSemester) || {};
    DB.SemesterRecords.save(selectedStudentId, currentRecordSemester, { ...rec, courses }, session.userId);
    Toast.success('Saved', 'Course-wise report updated.');
  }

  function saveSemesterRecord(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    
    DB.SemesterRecords.save(selectedStudentId, currentRecordSemester, data, session.userId);
    
    // Check if at-risk (attendance alert)
    if (parseFloat(data.attendance) < 75) {
      const student = DB.Users.getById(selectedStudentId);
      DB.Notifications.create(session.userId, 'Low Attendance Alert', `${student.name}'s attendance fell to ${data.attendance}% in Sem ${currentRecordSemester}`, 'warning');
      updateNotifBadge();
    }

    Toast.success('Record Saved', `Semester ${currentRecordSemester} academic data updated.`);
  }

    window.handleClassCSVFile = function(input, classId) {
      const file = input.files[0];
      if (file) processClassCSV(file, classId);
    };

    function processClassCSV(file, classId) {
      const reader = new FileReader();
      reader.onload = e => {
        const text = e.target.result;
        window._pendingClassCSVText = text;
        const lines = text.trim().split('\n');
        const firstLine = lines[0] || '';
        const commaCount = (firstLine.match(/,/g) || []).length;
        const tabCount = (firstLine.match(/\t/g) || []).length;
        const delimiter = (tabCount > commaCount) ? '\t' : ',';

        const headers = lines[0].split(delimiter).map(h => h.trim());
        const previewRows = lines.slice(1, 6).filter(Boolean);

        document.getElementById('class-import-preview').innerHTML = `
          <div class="alert alert-info" style="margin-bottom:var(--space-3)">${Icons.info} ${lines.length - 1} student(s) found in file. Preview:</div>
          <div class="table-wrapper" style="max-height:160px;overflow-y:auto;border:1px solid var(--border-color);border-radius:var(--border-radius-md)">
            <table class="data-table" style="font-size:12px">
              <thead><tr><th>#</th>${headers.map(h => `<th>${Str.escHtml(h)}</th>`).join('')}</tr></thead>
              <tbody>
                ${previewRows.map((l, i) => `<tr><td>${i+1}</td>${l.split(delimiter).map(v => `<td>${Str.escHtml(v.trim())}</td>`).join('')}</tr>`).join('')}
                ${lines.length - 1 > 5 ? `<tr><td colspan="${headers.length + 1}" style="text-align:center;color:var(--text-tertiary)">... and ${lines.length - 1 - 5} more rows ...</td></tr>` : ''}
              </tbody>
            </table>
          </div>
          <button class="btn btn-primary mt-4 hover-lift press-scale" id="btn-do-class-import" onclick="doClassCSVImport('${classId}')" style="width:100%">
            ${Icons.upload} Import ${lines.length - 1} Students
          </button>`;
      };
      reader.readAsText(file);
    }

    window.doClassCSVImport = async function(classId) {
      const csvText = window._pendingClassCSVText;
      if (!csvText) { Toast.error('No CSV file loaded'); return; }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="loading-spinner"></span> Importing...`;

      const results = await DB.Users.bulkImport(csvText, session.userId, classId);
      const ok = results.filter(r => r.ok);
      const fail = results.filter(r => !r.ok);
      
      document.getElementById('class-import-results').innerHTML = `

        <div class="flex gap-2 mb-3">
          <span class="badge badge-green">${ok.length} Successful</span>
          ${fail.length ? `<span class="badge badge-red">${fail.length} Failed</span>` : ''}
        </div>
        <div style="max-height:150px;overflow-y:auto;border:1px solid var(--border-color);border-radius:var(--border-radius-md);padding:var(--space-2);background:var(--bg-surface-2)">
          ${results.map(r => `
            <div style="font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between;color:${r.ok ? 'var(--text-primary)' : 'var(--brand-danger)'}">
              <span>Row ${r.row}: ${Str.escHtml(r.email || '')}</span>
              <span>${r.ok ? '✓ Success' : '✗ ' + Str.escHtml(r.error)}</span>
            </div>
          `).join('')}

      if (ok.length) {

      Modal.create('sync-photos', {

        body: `
          <div class="form-group">
            <label class="form-label">Google Sheet published CSV URL</label>
            <input type="text" class="form-input" id="sp-sheet-url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
            <div class="form-hint">Must be published as a public CSV link (File -> Share -> Publish to web -> CSV).</div>
          </div>

              <select class="form-select" id="sp-match-key" onchange="updateSyncMatchPlaceholder()">
                <option value="rollNo">Register/Roll Number</option>

              </select>
            </div>

            </div>
            <div class="form-group">
              <label class="form-label required">Photo Column Header</label>
              <input type="text" class="form-input" id="sp-col-photo" value="Upload Photo" placeholder="e.g. Upload Photo">
            </div>

          <div id="sp-results-area" style="margin-top:var(--space-3)"></div>
        `,
        footer: `

    window.startPhotoSync = async function(btn, classId) {
      const url = document.getElementById('sp-sheet-url').value.trim();
      let csvText = document.getElementById('sp-csv-text').value.trim();
      const matchKey = document.getElementById('sp-match-key').value;
      const colMatch = document.getElementById('sp-col-match').value.trim().toLowerCase();
      const colPhoto = document.getElementById('sp-col-photo').value.trim().toLowerCase();
      const resultsArea = document.getElementById('sp-results-area');

      if (!url && !csvText) {
        Toast.error('Please provide a Google Sheet URL or paste CSV content.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="loading-spinner"></span> Syncing…`;
      resultsArea.innerHTML = `<div class="alert alert-info">Processing...</div>`;

      try {
        if (url && !csvText) {
          resultsArea.innerHTML = `<div class="alert alert-info">Fetching Google Sheet data…</div>`;
          
          let fetchUrl = url;
          const sheetIdMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
          if (sheetIdMatch) {
            const sheetId = sheetIdMatch[1];
            const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
            const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : '';
            if (!url.includes('/pub') && !url.includes('/export')) {
              fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv${gidParam}`;
            }
          }

          let resp;
          try {
            resp = await fetch(fetchUrl);
          } catch (e) {
            try {
              resultsArea.innerHTML = `<div class="alert alert-info">Direct fetch blocked by CORS. Retrying via CORS Proxy 1…</div>`;
              const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(fetchUrl)}`;
              resp = await fetch(proxyUrl);
              if (!resp.ok) throw new Error('Proxy 1 returned non-OK status');
            } catch (proxyErr1) {
              try {
                resultsArea.innerHTML = `<div class="alert alert-info">CORS Proxy 1 failed. Retrying via CORS Proxy 2…</div>`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(fetchUrl)}`;
                resp = await fetch(proxyUrl);
                if (!resp.ok) throw new Error('Proxy 2 returned non-OK status');
              } catch (proxyErr2) {
                try {
                  resultsArea.innerHTML = `<div class="alert alert-info">CORS Proxy 2 failed. Retrying via CORS Proxy 3…</div>`;
                  const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(fetchUrl)}`;
                  resp = await fetch(proxyUrl);
                } catch (proxyErr3) {
                  throw new Error('Failed to fetch the URL (Network/CORS error). Please use the copy-paste CSV option.');
                }
              }
            }
          }

          if (!resp || !resp.ok) {
            throw new Error(`Failed to fetch URL. Status: ${resp ? resp.status : 'Unknown'}.`);
          }
          csvText = await resp.text();
        }

        // Parse CSV
        const parseCSVRows = (text) => {
          const firstLine = text.split(/\r?\n/)[0] || '';
          const commaCount = (firstLine.match(/,/g) || []).length;
          const tabCount = (firstLine.match(/\t/g) || []).length;
          const delimiter = (tabCount > commaCount) ? '\t' : ',';

          const result = [];
          let row = [''];
          let inQuotes = false;
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];
            if (char === '"') {
              if (inQuotes && nextChar === '"') {
                row[row.length - 1] += '"';
                i++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === delimiter && !inQuotes) {
              row.push('');
            } else if ((char === '\r' || char === '\n') && !inQuotes) {
              if (char === '\r' && nextChar === '\n') i++;
              result.push(row);
              row = [''];
            } else {
              row[row.length - 1] += char;
            }
          }
          if (row.length > 1 || row[0] !== '') result.push(row);
          return result;
        };

        const rows = parseCSVRows(csvText);
        if (rows.length < 2) {
          throw new Error('CSV must contain a header row and at least one data row.');
        }

        const headers = rows[0].map(h => h.trim().toLowerCase());
        const matchIdx = headers.indexOf(colMatch);
        const photoIdx = headers.indexOf(colPhoto);

        if (matchIdx === -1) throw new Error(`Match column "${colMatch}" not found in CSV headers.`);
        if (photoIdx === -1) throw new Error(`Photo column "${colPhoto}" not found in CSV headers.`);

        const students = DB.Classes.getStudents(classId);
        let matchedCount = 0;
        let skippedCount = 0;

        rows.slice(1).forEach(row => {
          const rawMatchVal = row[matchIdx];
          const rawPhotoVal = row[photoIdx];
          if (!rawMatchVal || !rawPhotoVal) {
            skippedCount++;
            return;
          }

          const matchValNormalized = rawMatchVal.trim().toLowerCase();
          const photoUrl = rawPhotoVal.trim();

          const matchedStudent = students.find(s => {
            const profile = DB.Profiles.get(s.id) || {};
            if (matchKey === 'rollNo') {
              return (profile.rollNo || '').trim().toLowerCase() === matchValNormalized ||
                     (profile.registerNo || '').trim().toLowerCase() === matchValNormalized;
            } else if (matchKey === 'phone') {
              const cleanVal = matchValNormalized.replace(/\D/g, '');
              const cleanSPhone = (s.phone || '').replace(/\D/g, '');
              const cleanPPhone = (profile.phone || '').replace(/\D/g, '');
              return (cleanSPhone && cleanSPhone.endsWith(cleanVal)) ||
                     (cleanPPhone && cleanPPhone.endsWith(cleanVal));
            } else if (matchKey === 'email') {
              return (s.email || '').trim().toLowerCase() === matchValNormalized;
            }
            return false;
          });

          if (matchedStudent) {
            const directPhotoUrl = Str.convertDriveLink(photoUrl);
            const existingProfile = DB.Profiles.get(matchedStudent.id) || {};
            DB.Profiles.save(matchedStudent.id, {
              ...existingProfile,
              avatarUrl: directPhotoUrl
            }, session.userId);
            matchedCount++;
          } else {
            skippedCount++;
          }
        });

        resultsArea.innerHTML = `
          <div class="alert alert-success">
            <strong>Sync Completed!</strong><br>
            Successfully updated photos for ${matchedCount} student(s) in this class.<br>
            ${skippedCount} row(s) could not be matched.
          </div>`;
        Toast.success('Sync Completed', `Synced ${matchedCount} photos.`);
        
        if (typeof openInchargeClass === 'function') {
          openInchargeClass(classId);
        }

      } catch (err) {
        console.error(err);
        resultsArea.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> ${Str.escHtml(err.message)}</div>`;
        Toast.error('Sync Failed', err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sync Photos';
      }
    };

    window.downloadImportTemplate = function() {
      const headers = ['name', 'email', 'rollno', 'registerno', 'phone', 'parentemail', 'photo'];
      const sampleRow = ['John Doe', 'john.doe@example.com', 'CS001', 'REG1002301', '9876543210', 'parent.doe@example.com', 'https://drive.google.com/file/d/1XyZ.../view'];
      const csvContent = [headers.join(','), sampleRow.join(',')].join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'student_import_template.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      Toast.success('Template Downloaded', 'Use this format to import students.');
    };
